<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>pco · mirror</title>
<style>
/* Design spec: docs/DESIGN.md ("Mirror"). Two voices: human (serif, ochre), machine (mono, cobalt). */
@font-face { font-family: "Newsreader"; src: url("/static/fonts/newsreader.woff2") format("woff2");
  font-weight: 200 800; font-style: normal; font-display: swap; }
@font-face { font-family: "Newsreader"; src: url("/static/fonts/newsreader-italic.woff2") format("woff2");
  font-weight: 200 800; font-style: italic; font-display: swap; }
@font-face { font-family: "Plex Mono"; src: url("/static/fonts/plexmono-400.woff2") format("woff2");
  font-weight: 400; font-style: normal; font-display: swap; }
@font-face { font-family: "Plex Mono"; src: url("/static/fonts/plexmono-500.woff2") format("woff2");
  font-weight: 500; font-style: normal; font-display: swap; }

:root {
  --bg: #F3F0E9; --surface: #FAF8F3; --ink: #191816; --ink-2: #4E4A44; --ink-3: #6B665D;
  --rule: #DCD6CA; --machine: #2747D9; --human: #8A5A12; --check: #B4331F;
  --sq-light: #E6E0D2; --sq-dark: #B3A994;
  --hl-human: rgba(176, 116, 24, .28); --hl-machine: rgba(39, 71, 217, .22);
  --hl-select: rgba(176, 116, 24, .38); --dot: rgba(25, 24, 22, .24);
  --shadow: 0 34px 60px -44px rgba(40, 32, 18, .45);
  --serif: "Newsreader", "Iowan Old Style", Charter, "Bitstream Charter", Georgia, serif;
  --mono: "Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --ease: cubic-bezier(.2, .7, .2, 1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111110; --surface: #191917; --ink: #ECE8E0; --ink-2: #B3AEA4; --ink-3: #8F8A80;
    --rule: #2B2A27; --machine: #93A6FF; --human: #E3AE52; --check: #F07A64;
    --sq-light: #8C8576; --sq-dark: #5F594E;
    --hl-human: rgba(227, 174, 82, .30); --hl-machine: rgba(147, 166, 255, .28);
    --hl-select: rgba(227, 174, 82, .42); --dot: rgba(236, 232, 224, .30);
    --shadow: 0 34px 60px -40px rgba(0, 0, 0, .8);
    color-scheme: dark;
  }
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font: 500 14px/20px var(--sans); -webkit-font-smoothing: antialiased; font-kerning: normal; }
button, input, a { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--machine); outline-offset: 2px; border-radius: 3px; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.serif { font-family: var(--serif); }
.label { margin: 0 0 12px; font: 500 10.5px/14px var(--mono); letter-spacing: .14em;
  text-transform: uppercase; color: var(--ink-3); }

/* ---- top bar ---- */
.top { height: 56px; display: flex; align-items: center; justify-content: space-between;
  padding: 0 max(28px, env(safe-area-inset-left)); border-bottom: 1px solid var(--rule); }
.brand { display: flex; align-items: baseline; gap: 10px; }
.brand .sq { width: 8px; height: 8px; background: var(--machine); align-self: center; }
.brand .word { font: 500 14px var(--mono); letter-spacing: .02em; }
.brand .sub { font: italic 400 16px var(--serif); color: var(--ink-2); }
.top-actions { display: flex; gap: 4px; }
.ghost { background: none; border: 0; padding: 8px 10px; border-radius: 6px; cursor: pointer;
  font: 500 10.5px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); }
.ghost:hover { color: var(--ink); }

/* ---- stage ---- */
.stage { max-width: 1180px; margin: 0 auto; padding: 36px 32px 48px; display: grid;
  grid-template-columns: minmax(0, 1fr) 340px; gap: 56px; align-items: start; }
.board-col { width: min(100%, 680px, max(380px, calc(100svh - 236px))); justify-self: end; }
.strip { height: 52px; display: flex; align-items: center; gap: 12px; }
.mark { width: 10px; height: 10px; flex: none; }
.mark.machine { background: var(--machine); }
.mark.human { background: var(--human); border-radius: 50%; }
.who { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.name { font: 500 17px/22px var(--serif); white-space: nowrap; }
.meta { font-size: 11px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.live { margin-left: auto; font: 400 11px var(--mono); color: var(--ink-3); white-space: nowrap;
  font-variant-numeric: tabular-nums; }
.live.busy { color: var(--machine); font: 500 10.5px var(--mono); letter-spacing: .14em; text-transform: uppercase; }
/* stepped, mechanical dots: a width reveal (animatable everywhere, unlike `content`) */
.dots::after { content: "···"; display: inline-block; overflow: hidden; vertical-align: bottom;
  width: 0; margin-left: .4ch; animation: dots 1.2s steps(4, end) infinite; }
@keyframes dots { to { width: 4ch; } }

.board-wrap { position: relative; aspect-ratio: 1; box-shadow: var(--shadow); border-radius: 2px; }
#board { display: block; width: 100%; height: 100%; touch-action: none; border-radius: 2px;
  transition: opacity .4s var(--ease); }
#board.over { opacity: .92; }
#board .sq-l { fill: var(--sq-light); } #board .sq-d { fill: var(--sq-dark); }
#board .hl-human { fill: var(--hl-human); } #board .hl-machine { fill: var(--hl-machine); }
#board .hl-select { fill: var(--hl-select); }
#board .coord { font: 500 13px var(--mono); pointer-events: none; }
#board .pc { transition: transform 180ms var(--ease); pointer-events: none; }
#board .pc.ghost { opacity: .3; }
#board .dot { fill: var(--dot); pointer-events: none; }
#board .ring { fill: none; stroke: var(--dot); stroke-width: 7; pointer-events: none; }
#board .drop { fill: none; stroke: var(--ink-2); stroke-width: 4; pointer-events: none; }
#board .arrow { fill: var(--machine); stroke: var(--machine); opacity: .55; pointer-events: none; }
#board .drag { pointer-events: none; filter: drop-shadow(0 6px 6px rgba(0,0,0,.25)); }

.promo { position: absolute; width: 12.5%; display: flex; flex-direction: column; z-index: 2;
  background: var(--surface); box-shadow: 0 12px 32px rgba(0,0,0,.28); border-radius: 3px; overflow: hidden; }
.promo.up { flex-direction: column-reverse; }
.promo button { aspect-ratio: 1; border: 0; padding: 6%; background: none; cursor: pointer; }
.promo button:hover, .promo button:focus-visible { background: var(--hl-select); }
.promo svg { width: 100%; height: 100%; display: block; }

.cmd { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.cmd .prompt { color: var(--ink-3); }
.cmd input { width: 132px; padding: 4px 0; border: 0; border-bottom: 1px solid var(--rule); background: none;
  font: 400 13px var(--mono); color: var(--ink); outline: none; transition: border-color .2s; }
.cmd input:focus { border-bottom: 1px solid var(--machine); box-shadow: 0 1px 0 var(--machine); }
.cmd input::placeholder { color: var(--ink-3); }
.cmd .hint { min-width: 7ch; font-size: 11px; color: var(--ink-3); }
.cmd .hint.ok { color: var(--machine); }

/* ---- instrument panel ---- */
.panel { padding-top: 52px; }
.panel section { padding: 22px 0; border-top: 1px solid var(--rule); }
.panel section:first-child { border-top: 0; padding-top: 4px; }
.status { margin: 0; min-height: 72px; font: 400 30px/36px var(--serif); letter-spacing: -.01em;
  font-optical-sizing: auto; }
.notice { margin: 8px 0 0; color: var(--check); font-size: 13px; }
.retry { margin-top: 10px; }
.decision .move { font: 500 44px/44px var(--serif); letter-spacing: -.01em; }
.decision .readout { margin-top: 10px; font: 400 12px/18px var(--mono); color: var(--ink-2); }
.decision.empty { font: italic 400 17px var(--serif); color: var(--ink-3); }
.spectrum { list-style: none; margin: 16px 0 0; padding: 0; }
.spectrum li { display: grid; grid-template-columns: 56px 1fr 52px; align-items: center; gap: 12px;
  height: 28px; padding: 0 6px; margin: 0 -6px; border-radius: 4px; cursor: default; }
.spectrum li:hover { background: var(--surface); }
.spectrum .san { font: 400 12.5px var(--mono); color: var(--ink-2); }
.spectrum .bar { height: 2px; background: var(--rule); position: relative; }
.spectrum .bar i { position: absolute; inset: 0 auto 0 0; background: var(--ink-3);
  transition: width .5s var(--ease); }
.spectrum .pct { font: 400 12px var(--mono); color: var(--ink-3); text-align: right; font-variant-numeric: tabular-nums; }
.spectrum li.chosen .san, .spectrum li.chosen .pct { color: var(--machine); font-weight: 500; }
.spectrum li.chosen .bar i { background: var(--machine); }
.spectrum li.outlier { margin-top: 6px; border-top: 1px dashed var(--rule); border-radius: 0; padding-top: 4px; height: 34px; }
.moves { list-style: none; margin: 0; padding: 0; max-height: 216px; overflow-y: auto;
  font: 400 12.5px/24px var(--mono); font-variant-numeric: tabular-nums; scrollbar-width: thin; }
.moves li { display: grid; grid-template-columns: 32px 1fr 1fr; }
.moves .n { color: var(--ink-3); }
.moves span { color: var(--ink-2); }
.moves span.now { color: var(--ink); box-shadow: inset 0 -1px 0 currentColor; justify-self: start; }
.moves.empty { font: italic 400 15px var(--serif); color: var(--ink-3); }
.actions { display: flex; align-items: center; gap: 6px; padding-top: 22px; border-top: 1px solid var(--rule); }
.primary { display: inline-flex; align-items: center; gap: 10px; height: 36px; padding: 0 14px;
  border: 0; border-radius: 6px; background: var(--ink); color: var(--bg); cursor: pointer;
  font: 500 13px var(--sans); transition: transform .12s var(--ease); }
.primary:active { transform: translateY(1px); }
.primary kbd { font: 500 10px var(--mono); opacity: .55; border: 1px solid currentColor; border-radius: 3px; padding: 0 4px; }
.text { height: 36px; padding: 0 10px; border: 0; background: none; border-radius: 6px; cursor: pointer;
  color: var(--ink-2); font: 500 13px var(--sans); text-decoration: none; display: inline-flex; align-items: center; }
.text:hover { color: var(--ink); }
.text.danger { color: var(--check); }
.text:disabled { opacity: .35; cursor: default; }
.foot { margin: 18px 0 0; font: 400 10.5px/16px var(--mono); color: var(--ink-3); }

/* ---- dialog & popover ---- */
dialog { width: min(420px, 92vw); padding: 28px; border: 1px solid var(--rule); border-radius: 10px;
  background: var(--surface); color: var(--ink); box-shadow: 0 24px 60px rgba(0,0,0,.25); }
dialog::backdrop { background: rgba(12, 12, 10, .28); backdrop-filter: blur(2px); }
dialog h2 { margin: 0 0 22px; font: 400 26px/30px var(--serif); }
.field { margin: 0 0 22px; border: 0; padding: 0; }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
.seg label { position: relative; }
.seg input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.seg span { display: block; padding: 7px 14px; font-size: 13px; color: var(--ink-2); }
.seg input:checked + span { background: var(--ink); color: var(--bg); }
.seg input:focus-visible + span { outline: 2px solid var(--machine); outline-offset: -2px; }
.row { display: flex; justify-content: space-between; align-items: baseline; }
input[type=range] { width: 100%; accent-color: var(--machine); margin: 10px 0 4px; }
input[type=number] { width: 120px; height: 34px; padding: 0 10px; border: 1px solid var(--rule);
  border-radius: 6px; background: var(--bg); }
.scale { display: flex; justify-content: space-between; font: 400 10.5px var(--mono); color: var(--ink-3); }
.scale .fit { color: var(--machine); }
.dialog-actions { display: flex; justify-content: flex-end; gap: 6px; margin-top: 6px; }
.shortcuts { position: fixed; top: 64px; right: max(28px, env(safe-area-inset-right)); z-index: 5;
  padding: 16px 18px; border: 1px solid var(--rule); border-radius: 8px; background: var(--surface);
  box-shadow: 0 18px 40px rgba(0,0,0,.18); }
.shortcuts dl { display: grid; grid-template-columns: auto auto; gap: 8px 18px; margin: 0; font: 400 12px var(--mono); }
.shortcuts dt { color: var(--ink); } .shortcuts dd { margin: 0; color: var(--ink-2); }

/* ---- small screens ---- */
@media (max-width: 860px) {
  .stage { grid-template-columns: 1fr; padding: 12px 16px 0; gap: 8px; }
  .board-col { width: 100%; justify-self: stretch; }
  .panel { padding-top: 8px; }
  .status { font-size: 26px; line-height: 32px; min-height: 64px; }
  .moves { max-height: 144px; }
  .actions { position: sticky; bottom: 0; background: var(--bg);
    padding: 12px 0 calc(12px + env(safe-area-inset-bottom)); }
  .cmd input { width: 104px; }
  .meta { display: none; }
  #board .coord { font-size: 20px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}
</style>

<script>
"use strict";
const FILES = "abcdefgh";
const SVGNS = "http://www.w3.org/2000/svg";
const $ = id => document.getElementById(id);
const reducedMotion = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);

let state = null;
const ui = {
  selected: null, flipped: false, busy: false, drag: null, arrow: null, promo: null,
  anim: null, resignArmed: null, sound: true, noPace: false, notice: null,
};
try { ui.sound = localStorage.getItem("pco.sound") !== "off"; } catch (e) { /* storage unavailable */ }

/* ------------------------------------------------------------ board geometry */
const svg = $("board");
const layers = {};
for (const name of ["squares", "hl", "coords", "pieces", "dots", "arrows", "drag"]) {
  layers[name] = el("g", { class: name === "drag" ? "drag" : name });
  svg.appendChild(layers[name]);
}

function el(tag, attrs, text) {
  const e = document.createElementNS(SVGNS, tag);
  for (const [k, v] of Object.entries(attrs || {})) e.setAttribute(k, v);
  if (text !== undefined) e.textContent = text;
  return e;
}
const flipped = () => !!state && ((state.human_color === "black") !== ui.flipped);
function xy(sq) {
  const f = FILES.indexOf(sq[0]), r = +sq[1] - 1;
  return flipped() ? [(7 - f) * 100, r * 100] : [f * 100, (7 - r) * 100];
}
function sqAt(x, y) {
  const c = Math.floor(x / 100), r = Math.floor(y / 100);
  if (c < 0 || c > 7 || r < 0 || r > 7) return null;
  return flipped() ? FILES[7 - c] + (r + 1) : FILES[c] + (8 - r);
}
function parseBoard(fen) {
  const out = {};
  fen.split(" ")[0].split("/").forEach((row, r) => {
    let f = 0;
    for (const ch of row) {
      if (/\d/.test(ch)) { f += +ch; continue; }
      out[FILES[f] + (8 - r)] = ch; f += 1;
    }
  });
  return out;
}
const isWhite = p => p === p.toUpperCase();
const mine = p => !!p && !!state && isWhite(p) === (state.human_color === "white");
const pieceId = p => "#p-" + (isWhite(p) ? "w" : "b") + p.toUpperCase();
const targetsFrom = from => state.legal_moves.filter(m => m.startsWith(from)).map(m => m.slice(2, 4));

/* ------------------------------------------------------------ rendering */
function render() { renderBoard(); renderPanel(); renderPromo(); }

function renderBoard() {
  if (!state) return;
  const pieces = parseBoard(state.fen);
  const last = state.last_move ? [state.last_move.slice(0, 2), state.last_move.slice(2, 4)] : [];
  const lastByHuman = state.last_move && state.turn !== state.human_color;
  const sqs = [], hl = [], coords = [], pcs = [], dots = [];
  for (let r = 1; r <= 8; r++) for (let f = 0; f < 8; f++) {
    const sq = FILES[f] + r, [x, y] = xy(sq), dark = (f + r) % 2 === 1;
    sqs.push(el("rect", { x, y, width: 100, height: 100, class: dark ? "sq-d" : "sq-l", "data-sq": sq }));
    if (last.includes(sq)) hl.push(el("rect", { x, y, width: 100, height: 100, class: lastByHuman ? "hl-human" : "hl-machine" }));
    if (sq === ui.selected) hl.push(el("rect", { x, y, width: 100, height: 100, class: "hl-select" }));
    const tone = dark ? "var(--sq-light)" : "var(--sq-dark)";
    if (x === 0) coords.push(el("text", { x: 7, y: y + 18, class: "coord", fill: tone }, String(r)));
    if (y === 700) coords.push(el("text", { x: x + 84, y: 792, class: "coord", fill: tone }, FILES[f]));
  }
  if (state.check) {
    const king = state.turn === "white" ? "K" : "k";
    const ksq = Object.keys(pieces).find(s => pieces[s] === king);
    if (ksq) { const [x, y] = xy(ksq); hl.push(el("circle", { cx: x + 50, cy: y + 50, r: 50, fill: "url(#check-glow)" })); }
  }
  for (const [sq, p] of Object.entries(pieces)) {
    const [x, y] = xy(sq);
    const use = el("use", { href: pieceId(p), x, y, width: 100, height: 100, class: "pc", "data-sq": sq });
    if (ui.drag && ui.drag.active && sq === ui.drag.from) use.classList.add("ghost");
    if (ui.anim && sq === ui.anim.slice(2, 4) && !reducedMotion) {
      const [fx, fy] = xy(ui.anim.slice(0, 2));
      use.style.transition = "none";
      use.style.transform = `translate(${fx - x}px, ${fy - y}px)`;
      requestAnimationFrame(() => requestAnimationFrame(() => { use.style.transition = ""; use.style.transform = ""; }));
    }
    pcs.push(use);
  }
  ui.anim = null;
  if (ui.selected && state.human_to_move) {
    for (const t of targetsFrom(ui.selected)) {
      const [x, y] = xy(t);
      dots.push(pieces[t] ? el("circle", { cx: x + 50, cy: y + 50, r: 46, class: "ring" })
                          : el("circle", { cx: x + 50, cy: y + 50, r: 14, class: "dot" }));
    }
  }
  layers.squares.replaceChildren(...sqs);
  layers.hl.replaceChildren(...hl);
  layers.coords.replaceChildren(...coords);
  layers.pieces.replaceChildren(...pcs);
  layers.dots.replaceChildren(...dots);
  renderArrow(); renderDrag();
  svg.classList.toggle("over", !!state.over);
  svg.setAttribute("aria-label", `Chess board, ${state.turn} to move${state.check ? ", check" : ""}`);
}

function renderArrow() {
  layers.arrows.replaceChildren();
  if (!ui.arrow || !state) return;
  const [ax, ay] = xy(ui.arrow.slice(0, 2)), [bx, by] = xy(ui.arrow.slice(2, 4));
  const x1 = ax + 50, y1 = ay + 50, x2 = bx + 50, y2 = by + 50;
  const len = Math.hypot(x2 - x1, y2 - y1), ux = (x2 - x1) / len, uy = (y2 - y1) / len;
  const head = 34, w = 7, hw = 19, ex = x2 - ux * head, ey = y2 - uy * head, px = -uy, py = ux;
  const pts = [[x1 + px * w, y1 + py * w], [ex + px * w, ey + py * w], [ex + px * hw, ey + py * hw], [x2, y2],
               [ex - px * hw, ey - py * hw], [ex - px * w, ey - py * w], [x1 - px * w, y1 - py * w]];
  layers.arrows.appendChild(el("polygon", { points: pts.map(p => p.join(",")).join(" "), class: "arrow" }));
}

function renderDrag() {
  layers.drag.replaceChildren();
  const d = ui.drag;
  if (!d || !d.active || !d.pos || !state) return;
  const p = parseBoard(state.fen)[d.from];
  const over = sqAt(d.pos.x, d.pos.y);
  if (over && targetsFrom(d.from).includes(over)) {
    const [x, y] = xy(over);
    layers.drag.appendChild(el("rect", { x: x + 2, y: y + 2, width: 96, height: 96, class: "drop" }));
  }
  if (p) layers.drag.appendChild(el("use", { href: pieceId(p), x: d.pos.x - 55, y: d.pos.y - 60, width: 110, height: 110 }));
}

function statusText() {
  if (!state) return "Loading.";
  const o = state.over;
  if (o) {
    const humanWon = (o.result === "1-0") === (state.human_color === "white");
    return {
      checkmate: humanWon ? "Checkmate. You won." : "Checkmate. It won.",
      resignation: "You resigned.",
      stalemate: "Stalemate. A draw.",
      insufficient_material: "A draw. Not enough material.",
      threefold_repetition: "A draw by repetition.",
      fivefold_repetition: "A draw by repetition.",
      fifty_moves: "A draw. Fifty quiet moves.",
      seventyfive_moves: "A draw. Seventy-five quiet moves.",
    }[o.reason] || `Game over. ${o.result}.`;
  }
  if (state.error && state.opponent_to_move) return "It couldn't move.";
  if (ui.busy || state.opponent_to_move) return "Its move.";
  return state.check ? "Your move. You're in check." : "Your move.";
}

function renderPanel() {
  if (!state) return;
  const o = state.opponent;
  $("opp-name").textContent = o.personal ? "You, reconstructed" : "Maia";
  $("opp-meta").textContent = o.personal
    ? `${o.name} · model ${String(o.model || "").slice(0, 10)} · T ${(+o.temperature).toFixed(2)}`
    : `generic · ${o.elo} · T ${(+o.temperature).toFixed(2)}`;
  $("you-meta").textContent = state.human_color;
  const live = $("opp-live");
  live.classList.toggle("busy", ui.busy);
  live.classList.toggle("dots", ui.busy);
  live.textContent = ui.busy ? "Considering" : (state.last_choice && !state.over ? `${state.last_choice.latency_ms} ms` : "");

  $("status").textContent = statusText();
  const notice = ui.notice || (state.error ? state.error : null);
  $("notice").hidden = !notice;
  $("notice").textContent = notice || "";
  $("retry").hidden = !(state.error && state.opponent_to_move && !ui.busy);

  const c = state.last_choice, dec = $("decision"), spec = $("spectrum");
  if (!c) {
    dec.className = "decision empty"; dec.textContent = "No move yet.";
    spec.replaceChildren();
  } else {
    dec.className = "decision";
    dec.innerHTML = `<div class="move">${esc(c.san)}</div><div class="readout">p ${fmt2(c.probability)}`
      + (c.likeness == null ? "" : ` · likeness ${fmt2(c.likeness)}`) + ` · ${c.latency_ms} ms</div>`;
    // The played move is always shown, even when it was an outlier outside the top five.
    const rows = c.top.some(t => t.uci === c.uci) ? c.top
      : [...c.top, { uci: c.uci, san: c.san, probability: c.probability, outlier: true }];
    spec.replaceChildren(...rows.map(t => {
      const li = document.createElement("li");
      li.dataset.uci = t.uci;
      if (t.uci === c.uci) li.className = t.outlier ? "chosen outlier" : "chosen";
      li.innerHTML = `<span class="san">${esc(t.san)}</span><span class="bar"><i style="width:${(t.probability * 100).toFixed(1)}%"></i></span>`
        + `<span class="pct">${pct(t.probability)}</span>`;
      li.title = "Hover to see it on the board";
      li.addEventListener("mouseenter", () => { ui.arrow = t.uci; renderArrow(); });
      li.addEventListener("mouseleave", () => { ui.arrow = null; renderArrow(); });
      return li;
    }));
  }

  const moves = $("moves"), san = state.san_moves;
  moves.classList.toggle("empty", san.length === 0);
  if (san.length === 0) moves.replaceChildren(Object.assign(document.createElement("li"), { textContent: "The board is waiting." }));
  else {
    const rows = [];
    for (let i = 0; i < san.length; i += 2) {
      const li = document.createElement("li");
      const n = document.createElement("span"); n.className = "n"; n.textContent = String(i / 2 + 1);
      const w = document.createElement("span"); w.textContent = san[i];
      const b = document.createElement("span"); b.textContent = san[i + 1] || "";
      if (i === san.length - 1) w.className = "now";
      if (i + 1 === san.length - 1) b.className = "now";
      li.append(n, w, b); rows.push(li);
    }
    moves.replaceChildren(...rows);
    moves.scrollTop = moves.scrollHeight;
  }

  const resign = $("resign");
  resign.disabled = !!state.over;
  resign.textContent = ui.resignArmed ? "Confirm resign" : "Resign";
  resign.classList.toggle("danger", !!ui.resignArmed);
  $("foot").textContent = o.personal
    ? `Model of ${o.name}, trained ${String(o.model || "").slice(0, 10)}. A statistical imitation of observable moves, not the player. Likeness is an estimate.`
    : `Generic human-move model ${o.model || ""}. Not personalized.`;
}

function renderPromo() {
  const box = $("promo");
  if (!ui.promo || !state) { box.hidden = true; box.replaceChildren(); return; }
  const to = ui.promo.to, [x, y] = xy(to), up = y !== 0;
  box.className = "promo" + (up ? " up" : "");
  box.style.left = `${x / 8}%`;
  box.style.top = up ? "" : "0";
  box.style.bottom = up ? "0" : "";
  const order = ["q", "n", "r", "b"], white = state.human_color === "white";
  box.replaceChildren(...order.map(k => {
    const uci = ui.promo.opts.find(m => m[4] === k);
    const b = document.createElement("button");
    b.dataset.uci = uci;
    b.setAttribute("aria-label", { q: "Queen", n: "Knight", r: "Rook", b: "Bishop" }[k]);
    b.innerHTML = `<svg viewBox="0 0 45 45"><use href="#p-${white ? "w" : "b"}${k.toUpperCase()}"/></svg>`;
    b.addEventListener("click", () => playMove(uci));
    return b;
  }));
  box.hidden = false;
}

const fmt2 = v => (v > 0 && v < 0.005 ? "<0.01" : v.toFixed(2));
const pct = v => (v > 0 && v < 0.0005 ? "<0.1" : (v * 100).toFixed(1));
const esc = s => String(s).replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));

/* ------------------------------------------------------------ server */
async function request(path, body) {
  const opts = body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) };
  try {
    const res = await fetch(path, opts);
    return { ok: res.ok, data: await res.json() };
  } catch (e) {
    return { ok: false, data: { error: "Lost the connection to pco. Is `pco play` still running?" } };
  }
}
function apply(r) {
  if (r.data.state) state = r.data.state;
  else if (r.ok) state = r.data;
  ui.notice = r.ok ? null : r.data.error;
  render();
  return r.ok;
}
const api = async (path, body) => apply(await request(path, body));
const sleep = ms => new Promise(res => setTimeout(res, ms));
// A beat proportional to uncertainty: confident replies come fast, hesitations feel human.
const paceFor = c => Math.min(1000, 250 + 750 * (1 - c.probability));
const pieceCount = fen => fen.split(" ")[0].replace(/[^a-zA-Z]/g, "").length;

async function playMove(uci) {
  if (!state || !state.human_to_move || ui.busy) return;
  const before = state.fen;
  ui.selected = null; ui.promo = null; ui.arrow = null;
  if (!ui.dropped) ui.anim = uci;
  ui.dropped = false;
  if (await api("/api/move", { uci })) {
    tick(pieceCount(state.fen) < pieceCount(before));
    await opponentTurn();
  }
}

async function opponentTurn() {
  if (!state || !state.opponent_to_move || ui.busy) return;
  ui.busy = true; ui.notice = null; renderPanel();
  const before = state.fen, t0 = performance.now();
  const r = await request("/api/opponent", {});
  const c = r.ok && r.data.last_choice;
  if (c && !ui.noPace) {
    const wait = paceFor(c) - (performance.now() - t0);
    if (wait > 0) await sleep(wait);
  }
  ui.busy = false;
  if (c) ui.anim = c.uci;
  apply(r);
  if (c) tick(pieceCount(state.fen) < pieceCount(before));
}

/* ------------------------------------------------------------ input: click, drag, type */
function clickSquare(sq) {
  if (!state || !state.human_to_move || ui.busy) return;
  const pieces = parseBoard(state.fen);
  if (ui.selected && ui.selected !== sq && tryMove(ui.selected, sq)) return;
  ui.selected = mine(pieces[sq]) && sq !== ui.selected ? sq : null;
  render();
}
function tryMove(from, to) {
  const opts = state.legal_moves.filter(m => m.slice(0, 4) === from + to);
  if (opts.length === 1) { playMove(opts[0]); return true; }
  if (opts.length > 1) { showPromotion(from, to, opts); return true; }
  return false;
}
function showPromotion(from, to, opts) {
  ui.selected = from; ui.promo = { from, to, opts }; render();
}
function svgPoint(e) {
  const pt = svg.createSVGPoint();
  pt.x = e.clientX; pt.y = e.clientY;
  return pt.matrixTransform(svg.getScreenCTM().inverse());
}

svg.addEventListener("pointerdown", e => {
  if (!state || !state.human_to_move || ui.busy || e.button > 0) return;
  const p0 = svgPoint(e), sq = sqAt(p0.x, p0.y);
  if (!sq) return;
  const own = mine(parseBoard(state.fen)[sq]);
  ui.drag = { from: sq, own, id: e.pointerId, x0: e.clientX, y0: e.clientY, active: false, pos: null,
              wasSelected: ui.selected === sq };
  if (own && ui.selected !== sq) { ui.selected = sq; ui.promo = null; render(); }
  if (own) { svg.setPointerCapture(e.pointerId); e.preventDefault(); }
});
svg.addEventListener("pointermove", e => {
  const d = ui.drag;
  if (!d || !d.own || e.pointerId !== d.id) return;
  if (!d.active && Math.hypot(e.clientX - d.x0, e.clientY - d.y0) < 4) return;
  if (!d.active) { d.active = true; renderBoard(); }
  d.pos = svgPoint(e);
  renderDrag();
});
svg.addEventListener("pointerup", e => {
  const d = ui.drag;
  if (!d || e.pointerId !== d.id) return;
  ui.drag = null;
  const p = svgPoint(e), sq = sqAt(p.x, p.y);
  if (d.active) {
    if (sq && targetsFrom(d.from).includes(sq)) { ui.dropped = true; tryMove(d.from, sq); return; }
    renderBoard();  // snap back
    return;
  }
  if (d.own) { if (d.wasSelected) { ui.selected = null; render(); } return; }
  clickSquare(d.from);
});
svg.addEventListener("pointercancel", () => { ui.drag = null; renderBoard(); });

const normSan = s => s.replace(/[+#!?]/g, "").replace(/0/g, "O");
function resolveTyped(text) {
  const t = text.trim();
  if (!t || !state) return { match: null, candidates: [] };
  const legal = state.legal || [];
  const exact = legal.find(m => m.uci === t.toLowerCase() || normSan(m.san) === normSan(t));
  if (exact) return { match: exact, candidates: [exact] };
  const cands = legal.filter(m => normSan(m.san).startsWith(normSan(t)) || m.uci.startsWith(t.toLowerCase()));
  return { match: cands.length === 1 ? cands[0] : null, candidates: cands };
}
const cmd = $("cmd"), hint = $("cmd-hint");
cmd.addEventListener("input", () => {
  const { match, candidates } = resolveTyped(cmd.value);
  hint.classList.toggle("ok", !!match);
  hint.textContent = !cmd.value.trim() ? "" : match ? `→ ${match.san}`
    : candidates.length ? candidates.slice(0, 3).map(m => m.san).join(" ") : "no such move";
});
cmd.addEventListener("keydown", e => {
  if (e.key === "Enter") {
    const { match } = resolveTyped(cmd.value);
    if (match && state.human_to_move) { cmd.value = ""; hint.textContent = ""; playMove(match.uci); }
  } else if (e.key === "Escape") { cmd.value = ""; hint.textContent = ""; cmd.blur(); }
});

/* ------------------------------------------------------------ chrome: new game, resign, keys, sound */
const dialog = $("newgame");
function openNewGame() {
  if (!state) return;
  const o = state.opponent;
  for (const r of document.querySelectorAll("input[name=color]")) r.checked = r.value === state.human_color;
  $("elo-field").hidden = !!o.personal;
  $("elo").value = o.elo;
  $("temp").value = o.temperature;
  $("temp-out").textContent = (+o.temperature).toFixed(2);
  $("temp-fit").textContent = o.personal ? `fitted to you · ${(+o.default_temperature).toFixed(2)}`
                                         : `default · ${(+o.default_temperature).toFixed(2)}`;
  dialog.showModal();
}
$("temp").addEventListener("input", e => { $("temp-out").textContent = (+e.target.value).toFixed(2); });
dialog.addEventListener("close", async () => {
  if (dialog.returnValue !== "start") return;
  let color = (document.querySelector("input[name=color]:checked") || {}).value || "white";
  if (color === "random") color = Math.random() < 0.5 ? "white" : "black";
  ui.selected = null; ui.promo = null; ui.arrow = null;
  if (await api("/api/new", { color, elo: +$("elo").value, temperature: +$("temp").value })) await opponentTurn();
});
$("new").addEventListener("click", openNewGame);
$("retry").addEventListener("click", opponentTurn);
$("resign").addEventListener("click", async () => {
  if (!ui.resignArmed) {
    ui.resignArmed = setTimeout(() => { ui.resignArmed = null; renderPanel(); }, 3000);
    renderPanel(); return;
  }
  clearTimeout(ui.resignArmed); ui.resignArmed = null;
  await api("/api/resign", {});
});
const help = $("help"), shortcuts = $("shortcuts");
function toggleHelp(force) {
  shortcuts.hidden = force === undefined ? !shortcuts.hidden : !force;
  help.setAttribute("aria-expanded", String(!shortcuts.hidden));
}
help.addEventListener("click", () => toggleHelp());
$("sound").addEventListener("click", () => {
  ui.sound = !ui.sound;
  try { localStorage.setItem("pco.sound", ui.sound ? "on" : "off"); } catch (e) { /* ignore */ }
  syncSound();
});
function syncSound() {
  $("sound").textContent = ui.sound ? "Sound on" : "Sound off";
  $("sound").setAttribute("aria-pressed", String(ui.sound));
}
document.addEventListener("keydown", e => {
  const typing = e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA");
  if (typing || dialog.open || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "/") { e.preventDefault(); cmd.focus(); }
  else if (e.key === "n" || e.key === "N") { e.preventDefault(); openNewGame(); }
  else if (e.key === "f" || e.key === "F") { ui.flipped = !ui.flipped; render(); }
  else if (e.key === "?") toggleHelp();
  else if (e.key === "Escape") { ui.selected = null; ui.promo = null; ui.arrow = null; toggleHelp(false); render(); }
});

let audio = null;
// A short filtered noise burst: a wooden tap, lower for captures. Synthesized, no assets.
function tick(capture) {
  if (!ui.sound) return;
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const t = audio.currentTime, len = Math.floor(audio.sampleRate * 0.05);
    const buf = audio.createBuffer(1, len, audio.sampleRate), data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 4);
    const src = audio.createBufferSource(), bp = audio.createBiquadFilter(), g = audio.createGain();
    bp.type = "bandpass"; bp.frequency.value = capture ? 900 : 1700; bp.Q.value = 1.4;
    g.gain.value = capture ? 0.9 : 0.6;
    src.buffer = buf; src.connect(bp).connect(g).connect(audio.destination); src.start(t);
  } catch (e) { /* audio unavailable: silent */ }
}

window.__pco = { clickSquare, resolveTyped, paceFor, statusText, playMove, opponentTurn, api, ui, layers,
                 get state() { return state; } };

syncSound();
api("/api/state").then(() => opponentTurn());
</script>
</body>
</html>
