[project]
name = "you-vs-you"
version = "0.0.1"
description = "You vs. You: a local-first chess opponent that learns how you play."
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "chess>=1.11,<2",
  "numpy>=2.1,<3",
  "torch>=2.8,<2.9",
  # Human-move prior (AGPL-3.0). Pinned to the commit validated in Iteration 0.
  "maia3",
]

[project.scripts]
pco = "pco.cli:main"

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.14,<1"]
# Only needed to reproduce the Iteration 0 prior comparison (scripts/feasibility_priors.py).
bench = ["maia2==0.11.0"]

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]
maia3 = { git = "https://github.com/CSSLab/maia3", rev = "1e13597c42d4858b7cfd7cfdae01e297263364b2" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pco"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "assets: needs downloaded model / engine assets (run `pco setup`); skipped otherwise",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501"]  # experiment scripts print wide result rows
"tests/fixtures/*" = ["E501"]  # fixture movetext mirrors real one-line PGN
