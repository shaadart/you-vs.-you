[project]
name = "you-vs-you"
version = "0.1.0"
description = "You vs. You: a local-first chess opponent that learns how you play."
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "chess>=1.11,<2",
  "numpy>=2.1,<3",
  # Runs the Maia-3 human-move prior (AGPL-3.0); weights exported by scripts/export_onnx.py.
  "onnxruntime>=1.20,<2",
  # The native window. Linux uses the default browser instead (WebKitGTK cannot be bundled).
  "pywebview>=5.3; sys_platform == 'win32' or sys_platform == 'darwin'",
]

[project.scripts]
pco = "pco.cli:main"

[project.gui-scripts]
you-vs-you = "pco.app:main"

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.14,<1"]
# Only to re-export the Maia-3 weights to ONNX (scripts/export_onnx.py): `uv sync --group export`.
# Release builds (packaging/): the frozen app and its icons.
build = ["pyinstaller>=6.10", "pillow>=10"]
export = ["torch>=2.8,<2.9", "onnx>=1.17", "maia3"]

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]
maia3 = { git = "https://github.com/CSSLab/maia3", rev = "1e13597c42d4858b7cfd7cfdae01e297263364b2" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pco"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "assets: needs downloaded model / engine assets (run `pco setup`); skipped otherwise",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501"]  # script output rows are wide
"tests/fixtures/*" = ["E501"]  # fixture movetext mirrors real one-line PGN
