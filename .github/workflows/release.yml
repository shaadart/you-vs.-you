name: release

# Push a tag like v0.1.0 (it must match `version` in pyproject.toml) to build the app for
# Windows, macOS (Apple silicon and Intel) and Linux, and publish it with checksums and
# build provenance. Run by hand (workflow_dispatch) to build without publishing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, name: windows-x64}
          - {os: macos-15, name: macos-arm64}
          - {os: macos-15-intel, name: macos-x64}
          - {os: ubuntu-22.04, name: linux-x64}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Qt's X11 helper libraries (bundled into the app) and a virtual screen
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # every X library Qt's xcb plugin and WebEngine link to (readelf over the PyQt6 wheels)
          sudo apt-get install -y --no-install-recommends xvfb xauth libegl1 libgl1 \
            libx11-6 libx11-xcb1 libxcb1 libxcb-cursor0 libxcb-dri3-0 libxcb-glx0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render0 libxcb-render-util0 \
            libxcb-shape0 libxcb-shm0 libxcb-sync1 libxcb-util1 libxcb-xfixes0 libxcb-xkb1 \
            libxcomposite1 libxdamage1 libxext6 libxfixes3 libxkbcommon0 libxkbcommon-x11-0 \
            libxkbfile1 libxrandr2 libxtst6 libnss3 libasound2 libcups2 libdbus-1-3 libfontconfig1
      - run: uv sync --frozen --group build
      - run: uv run pytest -q
      - run: uv run ruff check . && uv run ruff format --check .
      - name: Fetch the model and engine to ship inside the app (checksum-verified)
        run: uv run python packaging/fetch_assets.py
      - name: Freeze the app
        shell: bash
        run: |
          uv run pyinstaller packaging/you-vs-you.spec --noconfirm 2>&1 | tee pyinstaller.log
          # a library the app links to but the build machine lacks is missing for users too
          if [ "$RUNNER_OS" = Linux ] && grep "Library not found" pyinstaller.log | grep -v "libtcl\|libtk"; then
            echo "::error::install the libraries above on the build machine"; exit 1
          fi
      - name: Self-test the frozen app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PCO_EXPECT_BUNDLED: "1"
        run: |
          $p = Start-Process dist\YouVsYou\YouVsYou.exe -ArgumentList "--home","$env:RUNNER_TEMP\pco","--port","0","--self-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\pco\logs\app.log"; exit 1 }
      - name: Self-test the frozen app (macOS)
        if: runner.os == 'macOS'
        env:
          PCO_EXPECT_BUNDLED: "1"
        run: dist/YouVsYou.app/Contents/MacOS/YouVsYou --home "$RUNNER_TEMP/pco" --port 0 --self-test
      - name: Self-test the frozen app (Linux)
        if: runner.os == 'Linux'
        env:
          PCO_EXPECT_BUNDLED: "1"
        run: dist/YouVsYou/YouVsYou --home "$RUNNER_TEMP/pco" --port 0 --self-test

      # The real window on the real page: the page's script must reach the app through it.
      - name: Window test (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 5
        shell: pwsh
        run: |
          $p = Start-Process dist\YouVsYou\YouVsYou.exe -ArgumentList "--home","$env:RUNNER_TEMP\pco-window","--port","0","--window-test" -Wait -PassThru
          Get-Content "$env:RUNNER_TEMP\pco-window\logs\app.log", "$env:RUNNER_TEMP\pco-window\logs\crash.log" -ErrorAction SilentlyContinue
          "exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { exit 1 }
      - name: Window test (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 5
        run: dist/YouVsYou.app/Contents/MacOS/YouVsYou --home "$RUNNER_TEMP/pco-window" --port 0 --window-test
      - name: Window test (Linux, X11 under Xvfb)
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: xvfb-run -a dist/YouVsYou/YouVsYou --home "$RUNNER_TEMP/pco-window" --port 0 --window-test

      - name: Installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Microsoft's WebView2 bootstrapper; the installer runs it only if the runtime is missing
          Invoke-WebRequest "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile packaging\windows\MicrosoftEdgeWebview2Setup.exe
          $sig = Get-AuthenticodeSignature packaging\windows\MicrosoftEdgeWebview2Setup.exe
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') { throw "bad WebView2 bootstrapper signature" }
          iscc /DAppVersion=$((uv run python -c "import pco; print(pco.__version__)")) packaging\windows\you-vs-you.iss
      - name: Disk image (macOS)
        if: runner.os == 'macOS'
        run: |
          codesign --force --deep --sign - dist/YouVsYou.app   # ad hoc: Apple silicon refuses unsigned code
          mkdir installer
          # hdiutil sometimes fails with "Resource busy" on hosted runners: try a few times
          for try in 1 2 3 4 5; do
            hdiutil create -volname "You vs. You" -srcfolder dist/YouVsYou.app -ov -format ULMO "installer/YouVsYou-${{ matrix.name }}.dmg" && break  # ULMO: LZMA, macOS 10.15+
            [ "$try" = 5 ] && exit 1; echo "hdiutil failed; retrying in 15 s"; sleep 15
          done
      - name: Archive (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir installer
          cp packaging/linux/install.sh packaging/icons/icon.png dist/YouVsYou/
          XZ_OPT="-9 -T0" tar -C dist -cJf "installer/YouVsYou-${{ matrix.name }}.tar.xz" YouVsYou  # xz: 22% smaller than gzip
          cp packaging/linux/install.sh installer/   # curl ... /latest/download/install.sh | sh

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: installer/*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - name: The tag must match the version in pyproject.toml
        run: test "v$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)" = "$GITHUB_REF_NAME"
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Checksums
        run: cd release && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: release/*
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --title "$GITHUB_REF_NAME" --generate-notes
