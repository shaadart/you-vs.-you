name: release

# Push a tag like v0.1.0 (it must match `version` in pyproject.toml) to build the app for
# Windows, macOS (Apple silicon and Intel) and Linux, and publish it with checksums and
# build provenance. Run by hand (workflow_dispatch) to build without publishing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, name: windows-x64}
          - {os: macos-14, name: macos-arm64}
          - {os: macos-15-intel, name: macos-x64}
          - {os: ubuntu-22.04, name: linux-x64}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --group build
      - run: uv run pytest -q
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pyinstaller packaging/you-vs-you.spec --noconfirm

      - name: Self-test the frozen app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process dist\YouVsYou\YouVsYou.exe -ArgumentList "--home","$env:RUNNER_TEMP\pco","--port","0","--self-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\pco\logs\app.log"; exit 1 }
      - name: Self-test the frozen app (macOS)
        if: runner.os == 'macOS'
        run: dist/YouVsYou.app/Contents/MacOS/YouVsYou --home "$RUNNER_TEMP/pco" --port 0 --self-test
      - name: Self-test the frozen app (Linux)
        if: runner.os == 'Linux'
        run: dist/YouVsYou/YouVsYou --home "$RUNNER_TEMP/pco" --port 0 --self-test

      - name: Installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: iscc /DAppVersion=$((uv run python -c "import pco; print(pco.__version__)")) packaging\windows\you-vs-you.iss
      - name: Disk image (macOS)
        if: runner.os == 'macOS'
        run: |
          codesign --force --deep --sign - dist/YouVsYou.app   # ad hoc: Apple silicon refuses unsigned code
          mkdir installer
          hdiutil create -volname "You vs. You" -srcfolder dist/YouVsYou.app -ov -format UDZO "installer/YouVsYou-${{ matrix.name }}.dmg"
      - name: Archive (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir installer
          tar -C dist -czf "installer/YouVsYou-${{ matrix.name }}.tar.gz" YouVsYou

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: installer/*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - name: The tag must match the version in pyproject.toml
        run: test "v$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)" = "$GITHUB_REF_NAME"
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Checksums
        run: cd release && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: release/*
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --title "$GITHUB_REF_NAME" --generate-notes
